[alembic]
script_location = alembic
# "." covers both layouts: locally alembic.ini lives in backend/ next to app/,
# and in the container it sits at /app next to /app/app. The ".." entry keeps
# the previous behaviour for anyone running Alembic from a parent directory.
prepend_sys_path = . ..
version_path_separator = os

# The URL is read from the application settings (environment / .env) at runtime,
# so no credentials are stored in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
