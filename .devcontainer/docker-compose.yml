# SpendWise AI - GitHub Codespaces stack.
#
# This file is used ONLY by the Dev Container. It deliberately does NOT modify
# or include the root docker-compose.yml, so local workflows are untouched.
#
# It mirrors the root stack (postgres -> fastapi -> streamlit) and adds a "dev"
# service: the container the developer actually works inside.
#
# Secrets are NOT defined here. They are generated into .devcontainer/.env by
# .devcontainer/init-env.sh, which runs via the devcontainer "initializeCommand"
# on the host before Compose interpolates this file. The result is git-ignored.

name: spendwise-codespaces

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing .devcontainer/.env - run 'bash .devcontainer/init-env.sh' on the host before starting the container}
      POSTGRES_DB: ${POSTGRES_DB:-spendwise_db}
    volumes:
      - spendwise_codespaces_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendwise} -d ${POSTGRES_DB:-spendwise_db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published to the host: reachable only on the internal network.
    networks:
      - spendwise

  # The container the developer works in. Python 3.12 with the repo mounted.
  dev:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    volumes:
      - ..:/workspaces/spendwise-ai:cached
    command: sleep infinity
    environment:
      # Service names resolve on the internal network, exactly as in the root stack.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spendwise}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-spendwise_db}
      BACKEND_API_URL: http://localhost:8000
      JWT_SECRET: ${JWT_SECRET:?missing .devcontainer/.env - run 'bash .devcontainer/init-env.sh' on the host before starting the container}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Mirror frontend/Dockerfile: inside a Codespace there is no browser to
      # launch and no reason to report telemetry.
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "8501:8501"
    networks:
      - spendwise

volumes:
  spendwise_codespaces_pgdata:

networks:
  spendwise:
    driver: bridge
