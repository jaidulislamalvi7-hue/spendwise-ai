[project]
name = "spendwise-ai"
version = "0.2.0"
description = "SpendWise AI - Personal Expense & Lifestyle Intelligence System"
readme = "README.md"
authors = [{ name = "Jaidul Islam" }]
requires-python = ">=3.11"
dependencies = [
    # Web API (Batch 3) and its configuration layer.
    "pydantic-settings>=2.4,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    # Required by pydantic EmailStr, used for registration/login schemas.
    "email-validator>=2.1,<3.0",
    # Database (Batch 2).
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    # Authentication (Batch 3): Argon2 primary, bcrypt fallback.
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "bcrypt>=4.0",
    # Analytics and ML.
    "pandas>=2.2,<3.0",
    "numpy>=1.26,<3.0",
    "scikit-learn>=1.5,<2.0",
    # Frontend.
    "streamlit>=1.40,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
# Development tooling: linting, formatting and tests.
dev = [
    "pytest>=8.3,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]
